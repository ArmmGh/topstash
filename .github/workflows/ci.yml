# Builds and tests the app on every push and pull request to main.
#
# NOTE: This workflow will fail until ticket 01 adds project.yml (and the app
# and test targets). It starts passing once `xcodegen generate` has a project
# to generate.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme Topstash \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO
