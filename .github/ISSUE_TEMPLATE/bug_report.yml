name: Bug report
description: Something isn't working as expected.
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please search existing issues first.
        Security issues should be reported privately; see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Copy some text
        2. Hover over the notch
        3. Click the save card
        4. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version or commit
      placeholder: e.g. 0.1.0 or a commit SHA
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version
      placeholder: e.g. macOS 26.1
    validations:
      required: true
  - type: dropdown
    id: display
    attributes:
      label: Which display were you using?
      multiple: true
      options:
        - Built-in display with a notch
        - Built-in display without a notch
        - External display
    validations:
      required: true
  - type: dropdown
    id: paste-access
    attributes:
      label: Paste access setting for the app
      description: System Settings > Privacy & Security > Paste from Other Apps.
      options:
        - Always allow
        - Ask
        - Deny
        - Not sure
  - type: textarea
    id: extra
    attributes:
      label: Screenshots, logs, or anything else
      description: Please remove any private clipboard or note contents before posting.
